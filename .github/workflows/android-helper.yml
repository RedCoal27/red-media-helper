name: Red Media Mobile
run-name: Red Media Mobile validation (${{ github.ref_name }})

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-helper/**'
      - '.github/workflows/android-helper.yml'
  pull_request:
    paths:
      - 'android-helper/**'
      - '.github/workflows/android-helper.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Red Media Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK
        working-directory: android-helper
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: red-media-mobile-debug
          path: android-helper/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
