name: Preview Build
run-name: Build branch preview (${{ github.ref_name }})

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build all optimized artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: pwsh
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install extension dependencies
        run: npm ci

      - name: Build extension and Windows helper
        run: npm run package:release

      - name: Build optimized Android APKs
        working-directory: android-helper
        shell: pwsh
        run: .\gradlew.bat --no-daemon assembleRelease lintRelease

      - name: Collect preview files
        shell: pwsh
        run: |
          $preview = 'dist/preview'
          $apkDir = 'android-helper/app/build/outputs/apk/release'
          New-Item -ItemType Directory -Path $preview -Force | Out-Null
          Copy-Item 'dist/release/red-media-extension-unpacked.zip' $preview
          Copy-Item 'dist/release/Red Media Helper.exe' $preview
          Copy-Item "$apkDir/app-arm64-v8a-release.apk" "$preview/Red-Media-Mobile-arm64.apk"
          Copy-Item "$apkDir/app-armeabi-v7a-release.apk" "$preview/Red-Media-Mobile-arm32.apk"
          Copy-Item "$apkDir/app-x86_64-release.apk" "$preview/Red-Media-Mobile-x86_64.apk"
          Copy-Item "$apkDir/app-universal-release.apk" "$preview/Red-Media-Mobile-universal.apk"

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: red-media-helper-preview
          path: dist/preview/*
          if-no-files-found: error
