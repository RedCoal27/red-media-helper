name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create or update, for example v3.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: pwsh
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Package release assets
        run: npm run package:release

      - name: Build Red Media Mobile
        working-directory: android-helper
        shell: pwsh
        run: .\gradlew.bat --no-daemon assembleDebug

      - name: Add Android APK to release assets
        shell: pwsh
        run: Copy-Item android-helper/app/build/outputs/apk/debug/app-debug.apk dist/release/Red-Media-Mobile.apk

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "tag=${{ inputs.tag_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          $assets = Get-ChildItem dist/release -File | ForEach-Object { $_.FullName }
          $releaseExists = gh release view $env:RELEASE_TAG 2>$null

          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG @assets `
              --title "Red Media Helper $env:RELEASE_TAG" `
              --generate-notes
          } else {
            gh release upload $env:RELEASE_TAG @assets --clobber
          }
