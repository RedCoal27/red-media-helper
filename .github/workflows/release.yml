name: Release
run-name: Publish Red Media Helper (${{ github.ref_name }})

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create or update, for example v3.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: pwsh
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test extension and companion contracts
        run: npm test

      - name: Package release assets
        run: npm run package:release

      - name: Build Red Media Mobile
        working-directory: android-helper
        shell: pwsh
        env:
          RED_MEDIA_KEYSTORE_BASE64: ${{ secrets.RED_MEDIA_KEYSTORE_BASE64 }}
          RED_MEDIA_KEYSTORE_PASSWORD: ${{ secrets.RED_MEDIA_KEYSTORE_PASSWORD }}
          RED_MEDIA_KEY_ALIAS: ${{ secrets.RED_MEDIA_KEY_ALIAS }}
          RED_MEDIA_KEY_PASSWORD: ${{ secrets.RED_MEDIA_KEY_PASSWORD }}
        run: |
          if (-not $env:RED_MEDIA_KEYSTORE_BASE64) {
            throw 'Stable Android signing secrets are not configured.'
          }
          $keystore = Join-Path $env:RUNNER_TEMP 'red-media-release.jks'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:RED_MEDIA_KEYSTORE_BASE64))
          $env:RED_MEDIA_KEYSTORE_PATH = $keystore
          .\gradlew.bat --no-daemon assembleRelease

      - name: Add Android APK to release assets
        shell: pwsh
        run: |
          $apkDir = 'android-helper/app/build/outputs/apk/release'
          Copy-Item "$apkDir/app-arm64-v8a-release.apk" 'dist/release/Red-Media-Mobile-arm64.apk'
          Copy-Item "$apkDir/app-armeabi-v7a-release.apk" 'dist/release/Red-Media-Mobile-arm32.apk'
          Copy-Item "$apkDir/app-x86_64-release.apk" 'dist/release/Red-Media-Mobile-x86_64.apk'
          Copy-Item "$apkDir/app-universal-release.apk" 'dist/release/Red-Media-Mobile-universal.apk'

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "tag=${{ inputs.tag_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          $assets = Get-ChildItem dist/release -File | ForEach-Object { $_.FullName }
          $releaseExists = gh release view $env:RELEASE_TAG 2>$null

          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG @assets `
              --title "Red Media Helper $env:RELEASE_TAG" `
              --generate-notes
          } else {
            gh release upload $env:RELEASE_TAG @assets --clobber
          }
